# Every push: unit tests (Java), the shared-UI tests in a real browser, and a debug APK to try.
name: Build

on:
  push:
  pull_request:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with: { distribution: temurin, java-version: "17" }
      - uses: actions/setup-node@v4
        with: { node-version: "20" }
      - name: Android unit tests and debug APK
        working-directory: android
        run: |
          yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" "platforms;android-35" "build-tools;35.0.0" > /dev/null
          ./gradlew testDebugUnitTest lintDebug assembleDebug --no-daemon
      - name: UI tests (Chromium)
        run: |
          npm install -g playwright@1.56.1
          npx playwright install --with-deps chromium
          node android/tests/md.test.cjs
          NODE_PATH="$(npm root -g)" SHOTS=ui-shots node android/tests/ui.test.cjs
      - uses: actions/upload-artifact@v4
        with:
          name: debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
      - uses: actions/upload-artifact@v4
        if: always()
        with:
          name: ui-screenshots
          path: ui-shots
          if-no-files-found: ignore
